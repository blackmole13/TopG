<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./navigation.css"><title>TOPGIRL Season Results</title><style>
  *{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#272d28;font-family:Inter,"Noto Sans KR",system-ui,sans-serif}.wrap{max-width:1440px;margin:auto;padding:28px 20px 60px}.pages-layout>.wrap{min-width:0;width:100%;max-width:none;margin:0;padding:28px clamp(18px,3vw,42px) 60px}.eyebrow{color:#829082;font-size:10px;font-weight:800;letter-spacing:.14em}h1{margin:6px 0;font-size:27px}p{color:#858b83;font-size:13px}.card{margin-top:18px;padding:20px;background:#fff;border:1px solid #e8eae4;border-radius:15px}.scroll{max-height:72vh;overflow:auto}.grid{display:grid;grid-template-columns:150px repeat(16,minmax(78px,1fr));min-width:1450px;column-gap:0}.corner,.head,.row-label,.cell{min-height:50px;padding:7px 5px;border-right:1px solid #dfe4dd;border-bottom:1px solid #eceee9;font-size:11px}.corner,.head{position:sticky;top:0;z-index:3;background:#fff}.corner,.row-label{position:sticky;left:0;text-align:left;font-weight:700}.corner{z-index:5}.row-label{display:flex;align-items:center;gap:7px;z-index:2;background:#fff;overflow:hidden}.row-label img{width:30px;height:38px;flex:none;border-radius:5px;object-fit:cover}.row-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head{padding:3px 2px}.head button,.cell{width:100%;height:100%;border:0;color:inherit;cursor:pointer}.cell{border-right:1px solid #dfe4dd}.head button{padding:7px 2px;border-radius:7px;background:#fff;color:#626a62;font-size:10px}.head button.active{background:#eaf1eb;color:#315a3c;font-weight:800}.cell{display:flex;align-items:center;justify-content:flex-start;gap:6px;min-width:0;overflow:hidden;padding:5px 7px;border:1px solid transparent;border-radius:7px;text-align:left}.cell.filled{position:relative;display:block;min-height:50px;padding:0;border-color:hsl(var(--hue) 48% 60%);background-color:hsl(var(--hue) 78% 87%);background-image:repeating-linear-gradient(to right,transparent 0 calc(var(--season-width) - 1px),rgba(255,255,255,.82) calc(var(--season-width) - 1px) var(--season-width));color:hsl(var(--hue) 48% 24%);font-weight:700}.cell.filled.active{background-color:hsl(var(--hue) 85% 77%);box-shadow:inset 0 0 0 2px hsl(var(--hue) 55% 46%)}.role-strip{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--run-seasons),minmax(0,1fr));align-items:center;min-width:0;padding:0 2px}.role-strip span{justify-self:center;max-width:calc(100% - 4px);overflow:hidden;padding:4px 7px;border:1px solid rgba(65,75,65,.13);border-radius:6px;background:rgba(255,255,255,.84);color:#343b34;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:800;line-height:1}.gap-cell{min-height:50px}.detail{padding-top:16px}.detail h2{margin:5px 0 12px;font-size:18px}.member-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:9px}.member{padding:11px;border:1px solid #e8eae4;border-radius:11px}.member small,.member span{display:block;color:#858b83;font-size:10px}.member img{display:block;width:46px;height:58px;margin-top:7px;border-radius:6px;object-fit:cover}.member b{display:block;margin:7px 0 3px;font-size:13px}.skills{margin-top:19px}.skills h3,.candidate-section h3{margin:0 0 8px;font-size:14px}.skill{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #eceee9;font-size:12px}.skill small{color:#858b83}.empty{padding:18px;color:#858b83;font-size:12px}.candidate-section{margin-top:20px;padding-top:16px;border-top:1px solid #e8eae4}.candidate-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.candidate-heading span{color:#858b83;font-size:11px}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:9px}.candidate{min-width:0;padding:9px;border:1px solid #e8eae4;border-radius:11px;background:#fff}.candidate.newcomer{border:2px solid #d59a45;background:linear-gradient(135deg,#fff8e9,#fffdf8);box-shadow:0 3px 12px rgba(151,100,32,.1)}.candidate-main{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px}.candidate-image{position:relative;height:100px;overflow:hidden;border:2px solid #ddd;border-radius:9px;background:#f3f4f0}.candidate-image>img{width:100%;height:100%;object-fit:cover}.tier{position:absolute;left:5px;top:5px;padding:3px 6px;border-radius:5px;background:#596b5c;color:#fff;font-size:9px;font-weight:800}.candidate-info{display:flex;align-items:flex-start;flex-direction:column;gap:6px;min-width:0}.candidate-name{display:grid;min-width:0}.candidate-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.candidate-name small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#999e97;font-size:9px}.badges{display:flex;align-items:center;flex-wrap:wrap;gap:5px;color:#72796f;font-size:9px}.rank{padding:3px 5px;border-radius:5px;background:#777;color:#fff;font-size:9px;font-weight:800}.bonus{display:table;padding:3px 6px;border-radius:5px;background:#f8f1e8;color:#9b6a3d;font-size:9px;font-weight:700}.stats{display:flex;gap:9px;color:#8a9088;font-size:9px}.stats b{color:#4e564e;font-size:10px}.candidate-skills{display:grid;gap:4px;max-height:92px;overflow:auto;margin:9px 0 0;padding:8px;border-radius:7px;background:#f6f7f4}.candidate-skills b{color:#81887f;font-size:9px}.candidate-skills span{color:#555d55;font-size:10px;line-height:1.4}.no-candidates{padding:14px;border-radius:8px;background:#f7f8f5;color:#858b83;font-size:11px}@media(max-width:700px){.wrap{padding:20px 12px}.card{padding:13px}.member-grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:23px}}
  </style></head><body><div class="pages-layout"><aside class="pages-sidebar"><a class="pages-brand" href="./"><span class="pages-brand-mark">TG</span><span><b>TOPGIRL</b><small>PUBLIC DIRECTORY</small></span></a><div class="pages-nav-label">PAGES</div><nav class="pages-nav" aria-label="페이지"><a href="./"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>아티스트</a><a href="./party.html"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>파티 편성</a><a class="active" href="./party-result.html" aria-current="page"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17M7 15l4-4 3 2 6-7"/><circle cx="20" cy="6" r="1"/></svg></span>파티 결과</a><a href="./level-plan.html"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-2-5.8L4 11l6-2.2L12 3ZM19 14l1.2 3.3L23 18.5l-2.8 1.1L19 23l-1.1-3.4-2.9-1.1 2.9-1.2L19 14Z"/></svg></span>육성 계산</a></nav><div class="pages-sidebar-note">공개 아티스트 정보와 공유 결과</div></aside><main class="wrap"><span class="eyebrow">SEASON TRANSITIONS</span><h1 id="title">Season Party Results</h1><p id="intro"></p><section class="card"><div class="scroll"><div id="chart" class="grid"></div></div><div id="detail" class="detail"></div></section></main></div><script>
  fetch("./party-result.json").then(r=>r.json()).then(data=>{
    const esc=s=>String(s??"");
    document.title=data.genreLabel+" Season Results | TOPGIRL";
    document.getElementById("title").textContent=data.genreLabel+" 시즌 파티 편성 결과";
    document.getElementById("intro").textContent="시즌을 선택하면 해당 시점의 편성과 스킬 총합을 확인할 수 있습니다.";
    const chart=document.getElementById("chart"),detail=document.getElementById("detail");let selected=0;
    const people=new Map();data.seasons.forEach(season=>season.members.forEach(artist=>{if(artist)people.set(artist.id,artist)}));
    const tierOrder={"S+":0,S:1,A:2,B:3,C:4,D:5},rankOrder={UR:0,SSR:1,SR:2,R:3},tierColors={"S+":"#dc4d4d",S:"#ed873d",A:"#d5ad24",B:"#4e9b62",C:"#4786c5",D:"#356bb1"},rankColors={UR:"#ff6b6b",SSR:"#fbbf24",SR:"#8b5cf6",R:"#3b85f6"};
    function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=esc(text);return el}
    const formatStat=value=>value==null?"—":Number(value).toLocaleString("ko-KR");
    function candidateCard(artist,isNew){
      const card=node("article",isNew?"candidate newcomer":"candidate"),main=node("div","candidate-main"),image=node("div","candidate-image"),photo=node("img");photo.src="./"+artist.localImageFile;photo.alt=artist.nameKo;image.style.borderColor=rankColors[artist.rank]||"#ddd";image.append(photo,imageTag(artist.tier));
      const info=node("div","candidate-info"),name=node("div","candidate-name");name.append(node("b","",artist.nameKo),node("small","",artist.name));
      const badges=node("div","badges"),rank=node("span","rank",artist.rank);rank.style.background=rankColors[artist.rank]||"#777";badges.append(rank,node("span","",artist.role),node("span","",artist.season));
      info.append(name,badges);if(artist.experienceBonus>0)info.append(node("span","bonus","경험치 +"+artist.experienceBonus+"%"));
      const stats=node("div","stats");stats.append(node("span","","노래 "+formatStat(artist.singStat)),node("span","","댄스 "+formatStat(artist.danceStat)));info.append(stats);main.append(image,info);card.append(main);
      const skills=node("div","candidate-skills");skills.append(node("b","","스킬"));(artist.skills||[]).forEach(skill=>skills.append(node("span","",skill)));if(!(artist.skills||[]).length)skills.append(node("span","","표시할 스킬 설명이 없습니다."));card.append(skills);return card;
    }
    function imageTag(tier){const badge=node("em","tier",tier);badge.style.background=tierColors[tier]||"#596b5c";return badge}
    function render(){
      chart.replaceChildren();const corner=node("div","corner","캐릭터 / 시즌");chart.append(corner);
      data.seasons.forEach((season,index)=>{const head=node("div","head"),button=node("button",index===selected?"active":"",season.season);button.onclick=()=>{selected=index;render()};head.append(button);chart.append(head)});
      people.forEach(artist=>{
        const label=node("div","row-label"),photo=node("img");photo.src="./"+artist.localImageFile;photo.alt="";label.append(photo,node("span","",artist.nameKo));chart.append(label);
        let index=0;while(index<data.seasons.length){const present=data.seasons[index].members.some(member=>member&&member.id===artist.id);let end=index+1;while(end<data.seasons.length&&data.seasons[end].members.some(member=>member&&member.id===artist.id)===present)end++;const runStart=index,span=end-index;
          if(!present){const gap=node("span","gap-cell");gap.style.gridColumn="span "+span;chart.append(gap)}else{const cell=node("button","cell filled"+(selected>=index&&selected<end?" active":""));cell.style.gridColumn="span "+span;cell.style.setProperty("--hue",(artist.id*137.508)%360);cell.style.setProperty("--season-width",(100/span)+"%");cell.title=data.seasons[index].season+" ~ "+data.seasons[end-1].season+": "+artist.nameKo;const roles=node("div","role-strip");roles.style.setProperty("--run-seasons",span);let previousSlot=-1;for(let seasonIndex=runStart;seasonIndex<end;seasonIndex++){const slot=data.seasons[seasonIndex].members.findIndex(member=>member&&member.id===artist.id);if(slot>=0&&slot!==previousSlot){const role=node("span","",["댄서","센터","보컬","서브1","서브2"][slot]||"");role.title=data.slots[slot]||"";role.style.gridColumn=(seasonIndex-runStart+1)+" / span 1";roles.append(role)}previousSlot=slot}cell.append(roles);cell.onclick=()=>{selected=runStart;render()};chart.append(cell)}index=end;
        }
      });
      detail.replaceChildren();const season=data.seasons[selected],heading=node("h2","",season.season+" 편성");detail.append(heading);
      const members=node("div","member-grid");season.members.forEach((artist,index)=>{const card=node("div","member");card.append(node("small","",data.slots[index]));if(artist){const img=node("img");img.src="./"+artist.localImageFile;img.alt=artist.nameKo;card.append(img,node("b","",artist.nameKo),node("span","",artist.tier+" · "+artist.rank+" · "+artist.role))}else card.append(node("b","","미편성"));members.append(card)});detail.append(members);
      const skills=node("section","skills"),skillTitle=node("h3","","스킬 총합");skills.append(skillTitle);if(!season.skillTotals.length)skills.append(node("div","empty","합산할 스킬 수치가 없습니다."));
      season.skillTotals.forEach(effect=>{const row=node("div","skill"),unit=effect.unit==="percent"?"%":effect.unit?" "+effect.unit:"";row.append(node("span","",effect.label),node("b","",(effect.value>0?"+":"")+effect.value+unit));skills.append(row)});detail.append(skills);
      const section=node("section","candidate-section"),candidateHeading=node("div","candidate-heading"),candidateTitle=node("h3","",selected===0?"초기 시즌 후보":"시즌 신규 후보"),candidates=(season.newCandidates||[]).slice().sort((a,b)=>(tierOrder[a.tier]??99)-(tierOrder[b.tier]??99)||(rankOrder[a.rank]??99)-(rankOrder[b.rank]??99)||a.nameKo.localeCompare(b.nameKo,"ko"));candidateHeading.append(candidateTitle,node("span","",candidates.length+"명"));section.append(candidateHeading);
      if(candidates.length){const list=node("div","candidate-grid");candidates.forEach(artist=>list.append(candidateCard(artist,selected>0)));section.append(list)}else section.append(node("div","no-candidates","이 시즌의 신규 후보가 없습니다."));detail.append(section);
    }
    render();
  }).catch(()=>{document.getElementById("detail").textContent="결과 정보를 불러오지 못했습니다."});
  </script></body></html>
