  <script>
    const $=s=>document.querySelector(s);let artists=[];if(!document.querySelector('.pages-nav a[href="./calendar.html"]'))document.querySelector(".pages-nav")?.insertAdjacentHTML("beforeend",'<a href="./calendar.html"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>일정</a>');
    const rankOrder={UR:0,SSR:1,SR:2,R:3},rankColors={UR:"#ff6b6b",SSR:"#fbbf24",SR:"#8b5cf6",R:"#3b85f6"};
    const skillTiers={gold_gathering_speed_increase:"D",drive_speed_increase:"D",basic_attack_damage_reduction:"B",skill_damage_reduction:"B",conditional_dps:"C",skill_damage_increase:"A",world_building_guard_damage_increase:"C",rally_fan_capacity_increase:"A",fan_capacity_increase:"S",player_damage_increase:"A",basic_attack_damage_increase:"A"},skillTierColors={S:"#dc4d4d",A:"#ed873d",B:"#d5ad24",C:"#4e9b62",D:"#4786c5"};
    const genreLabels={Pop:"팝",Rock:"락",EDM:"EDM","Hip Hop":"힙합","R&B":"R&B"},genreIconFiles={Pop:"pop.png",Rock:"rock.png",EDM:"edm.png","Hip Hop":"hip-hop.png","R&B":"r-and-b.png"},specialtyLabels={"Augmentation dommage":"피해 증가","Dommage réduction":"피해 감소","Solo car":"단독 차량",Mixte:"혼합","HQ defense":"본부 방어",Rassemblement:"집결","Vitesse de conduite":"운전 속도","Économie":"경제"};
    const experienceBonusByName={"Alice":0,"Anna":20,"Antonia":20,"Anya":0,"Aoi":100,"Arashi":72.8,"Ariadne":0,"Audrey":0,"Aurelia":20,"Aurora":0,"Avery":0,"Aya":44,"Ayaka":0,"Bella":0,"Brooklyn":0,"Calliope":0,"Caroline":0,"Cassia":100,"Chizuru":0,"Cindy":0,"Claire":0,"Claudius":20,"Cornelia":20,"Daphne":0,"Dewi":20,"Diah":100,"Eirene":0,"Elame":72.8,"Ella":20,"Eri":20,"Everly":0,"Flora":20,"Hana":72.8,"Haruki":0,"Hestia":0,"Hikari":20,"Julia":0,"Kalani":100,"Keisha":20,"Kelly":0,"Kendell":44,"Kesnia":0,"Kokoro":0,"Layla":72.8,"Leilani":0,"Longkui":20,"Margot":44,"Marina":20,"Megan":0,"Mellissa":0,"Mio":44,"Miyuki":0,"Mizakura":72.8,"Moana":0,"Momona":72.8,"Momosaki":72.8,"Monica":20,"Natasha":0,"Nephthys":72.8,"Ningsih":20,"Nora":0,"Nova":0,"Octavia":20,"Paisley":0,"Ratih":0,"Rena":72.8,"Restari":20,"Riku":0,"Rin":20,"Rosemary":0,"Ruby":0,"Sari":0,"Savannah":0,"Serena":100,"Shiori":100,"Sienna":44,"Skylar":0,"Sloane":44,"Sora":0,"Talia":0,"Tanya":100,"Valentina":44,"Valerie":44,"Venalia":100,"Vivian":20,"Xenia":0,"Yukine":100,"Yumeno":44,"Yuuko":0,"Zendaya":0};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const skillHtml=s=>{const tier=skillTiers[s.effectType];return`<span class="skill-line">${tier?`<b class="skill-tier" style="background:${skillTierColors[tier]}">${tier}</b>`:''}<span>${esc(s.displayTextKo||'스킬 문구 준비 중')}</span></span>`};
    const normRank=s=>s.startsWith('UR')?'UR':s;
    const expValue=a=>Object.prototype.hasOwnProperty.call(experienceBonusByName,a.name)?experienceBonusByName[a.name]:null,expText=a=>expValue(a)==null?'경험치 정보 없음':`경험치 +${expValue(a)}%`,expClass=a=>{const v=expValue(a);return v==null?'unknown':v>=100?'max':v>=72.8?'high':v>=44?'medium':v>=20?'low':'zero'};
    function displaySeason(value){if(value==='Original'||value==='Universal')return'상시';if(value==='Auction'||value==='Auction House')return'경매장';if(value==='Anniversary')return'1st Anniversary';if(value==='2nd Anniversary'||value==='2nd Anniversary Artist')return'2nd Anniversary';const normalized=value==='Rome3'?'Rome 3':value;const m=normalized.match(/^(Tokyo|Bali|Rome)\s+(\d+)$/);return m?`${{Tokyo:'도쿄',Bali:'발리',Rome:'로마'}[m[1]]} ${m[2]}`:normalized}
    function filterSeason(value){return value==='Anniversary'||value==='2nd Anniversary'||value==='2nd Anniversary Artist'?'Anniversary':displaySeason(value)}
    function sortSeasons(values){const cityOrder={도쿄:0,발리:1,로마:2},special=['Anniversary','경매장','Community Event','Just Rosemary','SVS'];return [...values].sort((a,b)=>{if(a==='상시')return-1;if(b==='상시')return 1;const x=a.match(/^(도쿄|발리|로마) (\d+)$/),y=b.match(/^(도쿄|발리|로마) (\d+)$/);if(x&&y)return Number(x[2])-Number(y[2])||cityOrder[x[1]]-cityOrder[y[1]];if(x)return 1;if(y)return-1;const ai=special.indexOf(a),bi=special.indexOf(b);if(ai!==-1||bi!==-1)return(ai===-1?99:ai)-(bi===-1?99:bi);return a.localeCompare(b,'ko')})}
    function img(a){return a.localImageFile?`<img src="./${esc(a.localImageFile)}" alt="${esc(a.nameKo)}" loading="lazy" onerror="this.remove()">`:`<span class="placeholder">${esc(a.name.slice(0,1))}</span>`}
    function seasonOptions(){return sortSeasons([...new Set(artists.map(a=>filterSeason(a.season)))])}
    function loadSavedSeasons(options){try{const saved=localStorage.getItem('topgirl-pages-season-filter-v1');if(saved===null)return options;const parsed=JSON.parse(saved);return Array.isArray(parsed)?parsed.filter(value=>options.includes(value)):options}catch{return options}}
    function fillSelect(id,values,label,order){const el=$(id);values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=label?label(v):v;el.append(o)});if(order)el.dataset.order='true'}
    function multiMenu(id,values,display,colors,selectedValues=values){const menu=$(`#${id}`);const title=id==='rank-options'?'표시할 등급':'표시할 시즌';menu.innerHTML=`<div class="menu-head"><span>${title}</span><button type="button" data-all>${selectedValues.length===values.length?'전체 해제':'전체 선택'}</button></div>`+values.map(v=>`<label><input type="checkbox" value="${esc(v)}" ${selectedValues.includes(v)?'checked':''}>${colors?`<i class="dot" style="background:${colors[v]}"></i>`:''}${esc(display?display(v):v)}</label>`).join('');menu.querySelector('[data-all]').onclick=()=>{const boxes=[...menu.querySelectorAll('input')],all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);menu.querySelector('[data-all]').textContent=all?'전체 선택':'전체 해제';updateMultiLabel(id)};menu.querySelectorAll('input').forEach(x=>x.onchange=()=>{menu.querySelector('[data-all]').textContent=[...menu.querySelectorAll('input')].every(y=>y.checked)?'전체 해제':'전체 선택';updateMultiLabel(id)});}
    function updateMultiLabel(id,persist=true,rerender=true){const detail=$(`#${id==='rank-options'?'rank-filter':'season-filter'}`),boxes=[...$(`#${id}`).querySelectorAll('input')],selected=boxes.filter(x=>x.checked).length;detail.classList.toggle('changed',selected!==boxes.length);detail.querySelector('summary').textContent=selected===boxes.length?(id==='rank-options'?'등급 전체':'시즌 전체'):selected===0?(id==='rank-options'?'등급 선택':'시즌 선택'):`${id==='rank-options'?'등급':'시즌'} ${selected}개`;if(id==='season-options'&&persist){try{localStorage.setItem('topgirl-pages-season-filter-v1',JSON.stringify(boxes.filter(x=>x.checked).map(x=>x.value)))}catch{}}if(rerender)render()}
    function picked(id){return [...$(`#${id}`).querySelectorAll('input:checked')].map(x=>x.value)}
    function sortArtists(rows){return [...rows].sort((a,b)=>(rankOrder[normRank(a.rank)]??99)-(rankOrder[normRank(b.rank)]??99)||a.nameKo.localeCompare(b.nameKo,'ko'))}
    function format(n){return n==null?'—':Number(n).toLocaleString('ko-KR')}
    function filtered(){const q=$('#query').value.trim().toLocaleLowerCase(),ranks=picked('rank-options'),seasons=picked('season-options');return sortArtists(artists.filter(a=>(!q||[a.name,a.nameKo,a.group].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&ranks.includes(normRank(a.rank))&&(!$('#genre').value||a.genre===$('#genre').value)&&(!$('#role').value||a.role===$('#role').value)&&(seasons.length===seasonOptions().length||seasons.includes(filterSeason(a.season)))&&(!$('#skill').value||(a.normalizedSkillEffects||[]).some(x=>x.category===$('#skill').value))))}
    function render(){const rows=filtered();$('#count').textContent=artists.length;$('#result-count').textContent=`${rows.length}명`;$('#status').hidden=true;$('#grid').innerHTML=rows.length?`<div class="grid">${rows.map(a=>`<article class="card" tabindex="0" data-id="${a.id}" style="--rank-color:${rankColors[normRank(a.rank)]||'#8b5cf6'}"><div class="portrait">${img(a)}<div class="picture-badges"><span class="badge rank" style="background:${rankColors[normRank(a.rank)]||'#8b5cf6'};color:#252724">${esc(normRank(a.rank))}</span></div></div><div class="info"><h3 class="name">${esc(a.nameKo||a.name)}</h3><div class="english">${esc(a.name)}</div><div class="meta"><img class="genre-icon" src="./images/genres/${genreIconFiles[a.genre]||''}" alt="${esc(genreLabels[a.genre]||a.genre)}" title="${esc(genreLabels[a.genre]||a.genre)}"><span>${esc(genreLabels[a.genre]||a.genre)}</span><i></i><span>${esc(a.role)}</span>${displaySeason(a.season)!=='상시'?`<i></i><span>${esc(displaySeason(a.season))}</span>`:''}</div><div class="exp-bonus ${expClass(a)}">${expText(a)}</div><div class="skills">${(a.normalizedSkillEffects||[]).map(skillHtml).join('')}</div></div></article>`).join('')} </div>`:'<div class="empty">검색 결과가 없습니다.</div>';$('#grid').querySelectorAll('.card').forEach(c=>{const open=()=>show(artists.find(a=>a.id===Number(c.dataset.id)));c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
    function show(a){const season=displaySeason(a.season);$('#dialog').innerHTML=`<button class="close" aria-label="닫기">×</button><div class="detail-hero"><div class="portrait">${img(a)}</div><div class="detail"><div class="eyebrow">${esc(a.group)}</div><h2>${esc(a.nameKo||a.name)}</h2><div class="english">${esc(a.name)}</div></div><span class="detail-rank" style="background:${rankColors[normRank(a.rank)]||'#8b5cf6'}">${esc(normRank(a.rank))}</span></div><div class="detail-grid">${[['시즌',season],['장르',`<span class="detail-genre"><img src="./images/genres/${genreIconFiles[a.genre]||''}" alt="">${esc(genreLabels[a.genre]||a.genre)}</span>`],['역할',a.role],['특성',specialtyLabels[a.specialty]||a.specialty||'—']].map(([k,v])=>`<div class="detail-item"><small>${esc(k)}</small><b>${k==='장르'?v:esc(v)}</b></div>`).join('')}</div><div class="detail-skills"><h3>스킬</h3>${(a.normalizedSkillEffects||[]).map(s=>`<div class="skill-row"><b>${skillHtml(s)}</b><small>${esc(s.category)}</small></div>`).join('')}</div><p class="english">${esc(a.description)}</p>`;$('#modal').classList.add('open');$('#dialog .close').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()}}
    function close(){$('#modal').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    const sortSelect=document.createElement('select');sortSelect.id='sort';sortSelect.className='filter-select sort-select';sortSelect.setAttribute('aria-label','아티스트 정렬');sortSelect.innerHTML='<option value="release">출시순</option><option value="latest">최신순</option><option value="name">이름순</option>';try{const savedSort=localStorage.getItem('topgirl-pages-artist-sort-v1');if(['release','latest','name'].includes(savedSort))sortSelect.value=savedSort}catch{}document.querySelector('.filter-row')?.append(sortSelect);
    function compareDirectorySeason(a,b){const x=filterSeason(a.season),y=filterSeason(b.season);if(x===y)return 0;return sortSeasons([x,y])[0]===x?-1:1}
    function sortArtists(rows){const mode=$('#sort')?.value||'release';return [...rows].sort((a,b)=>mode==='name'?a.nameKo.localeCompare(b.nameKo,'ko')||compareDirectorySeason(a,b):(mode==='latest'?-1:1)*compareDirectorySeason(a,b)||a.nameKo.localeCompare(b.nameKo,'ko'))}
    function cardHtml(a){return`<article class="card" tabindex="0" data-id="${a.id}" style="--rank-color:${rankColors[normRank(a.rank)]||'#8b5cf6'}"><div class="portrait">${img(a)}<div class="picture-badges"><span class="badge rank" style="background:${rankColors[normRank(a.rank)]||'#8b5cf6'};color:#252724">${esc(normRank(a.rank))}</span></div></div><div class="info"><h3 class="name">${esc(a.nameKo||a.name)}</h3><div class="english">${esc(a.name)}</div><div class="meta"><img class="genre-icon" src="./images/genres/${genreIconFiles[a.genre]||''}" alt="${esc(genreLabels[a.genre]||a.genre)}" title="${esc(genreLabels[a.genre]||a.genre)}"><span>${esc(genreLabels[a.genre]||a.genre)}</span><i></i><span>${esc(a.role)}</span>${displaySeason(a.season)!=='상시'?`<i></i><span>${esc(displaySeason(a.season))}</span>`:''}</div><div class="exp-bonus ${expClass(a)}">${expText(a)}</div><div class="skills">${(a.normalizedSkillEffects||[]).map(skillHtml).join('')}</div></div></article>`}
    function render(){const rows=filtered(),mode=$('#sort')?.value||'release';$('#count').textContent=artists.length;$('#result-count').textContent=`${rows.length}명`;$('#status').hidden=true;if(!rows.length)$('#grid').innerHTML='<div class="empty">검색 결과가 없습니다.</div>';else if(mode==='name')$('#grid').innerHTML=`<div class="grid">${rows.map(cardHtml).join('')}</div>`;else{const groups=new Map;rows.forEach(a=>{const season=filterSeason(a.season);groups.set(season,[...(groups.get(season)||[]),a])});$('#grid').innerHTML=`<div class="season-groups">${[...groups].map(([season,items])=>`<section class="season-section"><h2 class="season-title">${esc(season)}<small>${items.length}명</small></h2><div class="grid">${items.map(cardHtml).join('')}</div></section>`).join('')}</div>`}$('#grid').querySelectorAll('.card').forEach(c=>{const open=()=>show(artists.find(a=>a.id===Number(c.dataset.id)));c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
    sortSelect.addEventListener('change',()=>{try{localStorage.setItem('topgirl-pages-artist-sort-v1',sortSelect.value)}catch{}render()});
    ['#query','#genre','#role','#skill'].forEach(id=>$(id).addEventListener('input',render));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});
    fetch('./artists.json').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{artists=data;multiMenu('rank-options',['R','SR','SSR','UR'],null,rankColors,['R','SR','SSR']);const seasons=seasonOptions();multiMenu('season-options',seasons,null,null,loadSavedSeasons(seasons));updateMultiLabel('season-options',false,false);fillSelect('#genre',['Hip Hop','R&B','Rock','Pop','EDM'],v=>genreLabels[v]);fillSelect('#role',['보컬','댄서','센터']);fillSelect('#skill',['피해 증가','피해 감소','경제/골드 수집','이동/차량 속도','조건부 DPS','집결/팬 수용량','팬 수용량']);render()}).catch(()=>{$('#status').className='error';$('#status').textContent='아티스트 데이터를 불러오지 못했습니다. GitHub Pages에서 사이트를 열었는지 확인해 주세요.'});
  </script>
