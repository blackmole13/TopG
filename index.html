<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <title>TOPGIRL · Artist Database</title>
  <style>
    :root{font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#252824;background:#f5f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1420px;margin:auto;padding:0 34px 70px}.topbar{height:72px;position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid #e5e6df;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center;color:inherit;text-decoration:none}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:12px;background:#355c41;color:white;font-weight:800}.brand b{display:block;font-size:14px;letter-spacing:1.6px}.brand small{display:block;color:#989b93;font-size:9px;letter-spacing:1.8px;margin-top:2px}.tag{color:#777c74;font-size:11px}.heading{display:flex;align-items:end;justify-content:space-between;padding:39px 0 26px}.eyebrow{color:#969991;font-size:10px;letter-spacing:1.65px;font-weight:700}h1{font-size:31px;letter-spacing:-1.2px;margin:8px 0 5px}.sub{margin:0;color:#777c74;font-size:13px}.count{font-size:12px;color:#8f928c;padding-bottom:4px}.count b{font-size:25px;color:#252824;margin-right:4px}.filters{background:white;border:1px solid #e5e6df;border-radius:15px;padding:13px 15px;box-shadow:0 2px 10px #1a281c05}.search{height:42px;width:100%;padding:0 12px;border:1px solid #e3e4dd;border-radius:10px;color:#343831;font:inherit;font-size:13px}.filter-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}.filter-title{color:#777c75;font-size:11px;margin-right:3px}.filter-select{min-height:31px;padding:0 24px 0 9px;border:1px solid #ecece8;border-radius:7px;background:#fff;color:#696d66;font:inherit;font-size:11px;max-width:180px}.filter-select.has-value{border-color:#bccbc0;background:#f7faf7;color:#345e40}.multi{position:relative}.multi summary{list-style:none;cursor:pointer;min-height:31px;padding:7px 24px 6px 9px;border:1px solid #ecece8;border-radius:7px;background:white;color:#696d66;font-size:11px;white-space:nowrap}.multi summary::-webkit-details-marker{display:none}.multi[open] summary,.multi.changed summary{border-color:#bccbc0;background:#f7faf7;color:#345e40}.menu{position:absolute;top:36px;left:0;z-index:5;width:205px;max-height:340px;overflow:auto;padding:8px;background:white;border:1px solid #e5e6df;border-radius:10px;box-shadow:0 10px 25px #20282020}.menu-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px;border-bottom:1px solid #eee;color:#777;font-size:11px}.menu-head button{border:0;background:none;color:#55745b;font:inherit;cursor:pointer}.menu label{display:flex;gap:8px;align-items:center;padding:7px 5px;font-size:12px;cursor:pointer}.menu input{accent-color:#446e4b}.dot{width:8px;height:8px;border-radius:50%}.results{display:flex;justify-content:space-between;color:#75776f;font-size:13px;padding:23px 2px 12px}.tier-section+.tier-section{margin-top:25px;padding-top:18px;border-top:2px solid #dfe5dc}.tier-title{display:flex;align-items:center;gap:9px;margin:0 2px 12px;padding-left:10px;border-left:4px solid var(--tier);font-size:17px}.tier-title small{font-size:10px;color:#92958e;font-weight:400}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{cursor:pointer;overflow:hidden;border:1px solid #e4e3dc;border-radius:12px;background:#fff;transition:transform .16s,box-shadow .16s}.card:hover{transform:translateY(-2px);box-shadow:0 7px 18px #26352b18}.portrait{height:178px;position:relative;background:linear-gradient(135deg,#e8e9e0,#f5e9e4);display:grid;place-items:center;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 30%}.placeholder{font-size:52px;font-weight:700;color:#7c8577}.picture-badges{position:absolute;left:9px;top:9px;right:9px;display:flex;justify-content:space-between;align-items:start}.badge{font-size:10px;font-weight:700;padding:5px 7px;border-radius:7px;background:#ffffffdf;color:#42483f}.rank{color:#252724}.info{padding:11px 12px 13px}.name{font-weight:750;font-size:14px;margin:0}.english{color:#9a9d96;font-size:10px;margin-top:3px}.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;color:#70756c;font-size:10px}.meta i{width:3px;height:3px;border-radius:50%;background:#b4b7af}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #f0f0ed}.stats small,.stats b{display:block}.stats small{font-size:8px;color:#a0a29c;letter-spacing:.08em}.stats b{font-size:11px;margin-top:3px}.skills{min-height:0;margin-top:7px;color:#686d63;font-size:10px;line-height:1.45}.skills span{display:block;margin-top:4px}.empty,.loading,.error{padding:60px 10px;text-align:center;color:#76786f}.modal{position:fixed;inset:0;background:#151a166e;display:none;place-items:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}.modal.open{display:grid}.dialog{position:relative;background:white;border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 18px 70px #131f1738}.detail-hero{display:flex;align-items:center;gap:12px;padding:8px 25px 18px 0;border-bottom:1px solid #e4e3dc}.detail-hero .portrait{width:58px;height:58px;flex:none;border-radius:50%}.detail .english{font-size:11px}.detail{min-width:0}.detail h2{font-size:21px;margin:5px 0 1px}.detail-rank{margin-left:auto;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:800}.close{position:absolute;right:15px;top:15px;border:0;background:#f2f3ef;width:33px;height:33px;border-radius:50%;font-size:19px;cursor:pointer;z-index:1}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.detail-item{background:#f7f7f4;border-radius:8px;padding:9px}.detail-item small,.detail-item b{display:block}.detail-item small{font-size:9px;color:#92958e}.detail-item b{font-size:11px;margin-top:5px;overflow-wrap:anywhere}.detail-skills h3{font-size:12px;margin:17px 0 8px}.skill-row{padding:9px 0;border-top:1px solid #f0f0ed;font-size:11px}.skill-row small{display:block;color:#969991;font-size:9px;margin-top:5px}.footer{text-align:center;color:#909188;font-size:12px;margin-top:44px}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.portrait{height:165px}}@media(max-width:580px){.shell{padding:0 16px 50px}.topbar{height:68px}.tag{font-size:10px}.heading{padding:28px 0 20px}h1{font-size:29px}.filter-row{gap:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.portrait{height:152px}.info{padding:10px}.name{font-size:13px}.dialog{padding:18px}.detail-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
  <style>
    .grid{gap:15px}
    .portrait{height:clamp(145px,17vw,225px)}
    .portrait img{object-position:center center}
    @media(min-width:1500px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    @media(max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.portrait{height:clamp(138px,48vw,220px)}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="./"><span class="mark">TG</span><span><b>TOPGIRL</b><small>ARTIST DATABASE</small></span></a><span class="tag">공개 아티스트 도감</span></header>
    <section class="heading"><div><div class="eyebrow">ARTIST DATABASE</div><h1>아티스트</h1><p class="sub">아티스트 정보를 검색하고 필터링해 보세요.</p></div><div class="count"><b id="count">—</b>명</div></section>
    <section class="filters" aria-label="아티스트 필터"><input class="search" id="query" type="search" placeholder="이름, 그룹 검색" aria-label="이름 또는 그룹 검색"><div class="filter-row"><span class="filter-title">필터</span><details class="multi" id="rank-filter"><summary>등급 전체</summary><div class="menu" id="rank-options"></div></details><select class="filter-select" id="tier"><option value="">티어 전체</option></select><select class="filter-select" id="genre"><option value="">장르 전체</option></select><select class="filter-select" id="role"><option value="">역할 전체</option></select><details class="multi" id="season-filter"><summary>시즌 전체</summary><div class="menu" id="season-options"></div></details><select class="filter-select" id="skill"><option value="">스킬 종류 전체</option></select></div></section>
    <div class="results"><span>아티스트 목록</span><span id="result-count"></span></div><div id="status" class="loading">목록을 불러오는 중…</div><div id="grid"></div>
    <footer class="footer">TOPGIRL · Artist reference data</footer>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="아티스트 정보"><article class="dialog" id="dialog"></article></div>
  <script>
    const $=s=>document.querySelector(s);let artists=[];
    const tierOrder={"S+":0,S:1,A:2,B:3,C:4,D:5},rankOrder={UR:0,SSR:1,SR:2,R:3},tierColors={"S+":"#dc4d4d",S:"#ed873d",A:"#d5ad24",B:"#4e9b62",C:"#4786c5",D:"#356bb1"},rankColors={UR:"#ff6b6b",SSR:"#fbbf24",SR:"#8b5cf6",R:"#3b85f6"};
    const genreLabels={Pop:"팝",Rock:"락",EDM:"EDM","Hip Hop":"힙합","R&B":"R&B"},specialtyLabels={"Augmentation dommage":"피해 증가","Dommage réduction":"피해 감소","Solo car":"단독 차량",Mixte:"혼합","HQ defense":"본부 방어",Rassemblement:"집결","Vitesse de conduite":"운전 속도","Économie":"경제"};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normRank=s=>s.startsWith('UR')?'UR':s;
    function displaySeason(value){if(value==='Original'||value==='Universal')return'상시';if(value==='Auction')return'경매장';const normalized=value==='Rome3'?'Rome 3':value;const m=normalized.match(/^(Tokyo|Bali|Rome)\s+(\d+)$/);return m?`${{Tokyo:'도쿄',Bali:'발리',Rome:'로마'}[m[1]]} ${m[2]}`:normalized}
    function sortSeasons(values){const cityOrder={도쿄:0,발리:1,로마:2},special=['Anniversary','경매장','Community Event','Just Rosemary','SVS'];return [...values].sort((a,b)=>{if(a==='상시')return-1;if(b==='상시')return 1;const x=a.match(/^(도쿄|발리|로마) (\d+)$/),y=b.match(/^(도쿄|발리|로마) (\d+)$/);if(x&&y)return Number(x[2])-Number(y[2])||cityOrder[x[1]]-cityOrder[y[1]];if(x)return 1;if(y)return-1;const ai=special.indexOf(a),bi=special.indexOf(b);if(ai!==-1||bi!==-1)return(ai===-1?99:ai)-(bi===-1?99:bi);return a.localeCompare(b,'ko')})}
    function img(a){return a.localImageFile?`<img src="./${esc(a.localImageFile)}" alt="${esc(a.nameKo)}" loading="lazy" onerror="this.remove()">`:`<span class="placeholder">${esc(a.name.slice(0,1))}</span>`}
    function seasonOptions(){return sortSeasons([...new Set(artists.map(a=>displaySeason(a.season)))])}
    function loadSavedSeasons(options){try{const saved=localStorage.getItem('topgirl-pages-season-filter-v1');if(saved===null)return options;const parsed=JSON.parse(saved);return Array.isArray(parsed)?parsed.filter(value=>options.includes(value)):options}catch{return options}}
    function fillSelect(id,values,label,order){const el=$(id);values.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=label?label(v):v;el.append(o)});if(order)el.dataset.order='true'}
    function multiMenu(id,values,display,colors,selectedValues=values){const menu=$(`#${id}`);const title=id==='rank-options'?'표시할 등급':'표시할 시즌';menu.innerHTML=`<div class="menu-head"><span>${title}</span><button type="button" data-all>${selectedValues.length===values.length?'전체 해제':'전체 선택'}</button></div>`+values.map(v=>`<label><input type="checkbox" value="${esc(v)}" ${selectedValues.includes(v)?'checked':''}>${colors?`<i class="dot" style="background:${colors[v]}"></i>`:''}${esc(display?display(v):v)}</label>`).join('');menu.querySelector('[data-all]').onclick=()=>{const boxes=[...menu.querySelectorAll('input')],all=boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);menu.querySelector('[data-all]').textContent=all?'전체 선택':'전체 해제';updateMultiLabel(id)};menu.querySelectorAll('input').forEach(x=>x.onchange=()=>{menu.querySelector('[data-all]').textContent=[...menu.querySelectorAll('input')].every(y=>y.checked)?'전체 해제':'전체 선택';updateMultiLabel(id)});}
    function updateMultiLabel(id,persist=true,rerender=true){const detail=$(`#${id==='rank-options'?'rank-filter':'season-filter'}`),boxes=[...$(`#${id}`).querySelectorAll('input')],selected=boxes.filter(x=>x.checked).length;detail.classList.toggle('changed',selected!==boxes.length);detail.querySelector('summary').textContent=selected===boxes.length?(id==='rank-options'?'등급 전체':'시즌 전체'):selected===0?(id==='rank-options'?'등급 선택':'시즌 선택'):`${id==='rank-options'?'등급':'시즌'} ${selected}개`;if(id==='season-options'&&persist){try{localStorage.setItem('topgirl-pages-season-filter-v1',JSON.stringify(boxes.filter(x=>x.checked).map(x=>x.value)))}catch{}}if(rerender)render()}
    function picked(id){return [...$(`#${id}`).querySelectorAll('input:checked')].map(x=>x.value)}
    function sortArtists(rows){return [...rows].sort((a,b)=>(tierOrder[a.tier]??99)-(tierOrder[b.tier]??99)||(rankOrder[normRank(a.rank)]??99)-(rankOrder[normRank(b.rank)]??99)||a.nameKo.localeCompare(b.nameKo,'ko'))}
    function format(n){return n==null?'—':Number(n).toLocaleString('ko-KR')}
    function filtered(){const q=$('#query').value.trim().toLocaleLowerCase(),ranks=picked('rank-options'),seasons=picked('season-options');return sortArtists(artists.filter(a=>(!q||[a.name,a.nameKo,a.group].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&ranks.includes(normRank(a.rank))&&(!$('#tier').value||a.tier===$('#tier').value)&&(!$('#genre').value||a.genre===$('#genre').value)&&(!$('#role').value||a.role===$('#role').value)&&(seasons.length===seasonOptions().length||seasons.includes(displaySeason(a.season)))&&(!$('#skill').value||(a.normalizedSkillEffects||[]).some(x=>x.category===$('#skill').value))))}
    function render(){const rows=filtered();$('#count').textContent=artists.length;$('#result-count').textContent=`${rows.length}명`;$('#status').hidden=true;const tiers=Object.keys(tierOrder).filter(t=>rows.some(a=>a.tier===t));$('#grid').innerHTML=rows.length?tiers.map(t=>{const group=rows.filter(a=>a.tier===t);return`<section class="tier-section"><h2 class="tier-title" style="--tier:${tierColors[t]}">${t}<small>${group.length}명</small></h2><div class="grid">${group.map(a=>`<article class="card" tabindex="0" data-id="${a.id}" style="--rank-color:${rankColors[normRank(a.rank)]||'#8b5cf6'}"><div class="portrait">${img(a)}<div class="picture-badges"><span class="badge" style="color:${tierColors[t]}">${esc(a.tier)}</span><span class="badge rank" style="background:${rankColors[normRank(a.rank)]||'#8b5cf6'};color:#252724">${esc(normRank(a.rank))}</span></div></div><div class="info"><h3 class="name">${esc(a.nameKo||a.name)}</h3><div class="english">${esc(a.name)}</div><div class="meta"><span>${esc(a.role)}</span><i></i><span>${esc(genreLabels[a.genre]||a.genre)}</span>${displaySeason(a.season)!=='상시'?`<i></i><span>${esc(displaySeason(a.season))}</span>`:''}</div><div class="stats"><span><small>SING</small><b>${format(a.singStat)}</b></span><span><small>DANCE</small><b>${format(a.danceStat)}</b></span></div><div class="skills">${(a.normalizedSkillEffects||[]).map(s=>`<span>${esc(s.displayTextKo||'스킬 문구 준비 중')}</span>`).join('')}</div></div></article>`).join('')}</div></section>`}).join(''):'<div class="empty">검색 결과가 없습니다.</div>';$('#grid').querySelectorAll('.card').forEach(c=>{const open=()=>show(artists.find(a=>a.id===Number(c.dataset.id)));c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}})}
    function show(a){const season=displaySeason(a.season);$('#dialog').innerHTML=`<button class="close" aria-label="닫기">×</button><div class="detail-hero"><div class="portrait">${img(a)}</div><div class="detail"><div class="eyebrow">${esc(a.group)}</div><h2>${esc(a.nameKo||a.name)}</h2><div class="english">${esc(a.name)}</div></div><span class="detail-rank" style="background:${rankColors[normRank(a.rank)]||'#8b5cf6'}">${esc(normRank(a.rank))}</span></div><div class="detail-grid">${[['티어',a.tier],['시즌',season],['역할',a.role],['장르',genreLabels[a.genre]||a.genre],['가창력',format(a.singStat)],['춤',format(a.danceStat)],['특성',specialtyLabels[a.specialty]||a.specialty||'—']].map(([k,v])=>`<div class="detail-item"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div><div class="detail-skills"><h3>스킬</h3>${(a.normalizedSkillEffects||[]).map(s=>`<div class="skill-row"><b>${esc(s.displayTextKo||'스킬 문구 준비 중')}</b><small>${esc(s.category)}</small></div>`).join('')}</div><p class="english">${esc(a.description)}</p>`;$('#modal').classList.add('open');$('#dialog .close').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()}}
    function close(){$('#modal').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
    ['#query','#tier','#genre','#role','#skill'].forEach(id=>$(id).addEventListener('input',render));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))close()});
    fetch('./artists.json').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{artists=data;multiMenu('rank-options',['R','SR','SSR','UR'],null,rankColors,['R','SR','SSR']);const seasons=seasonOptions();multiMenu('season-options',seasons,null,null,loadSavedSeasons(seasons));updateMultiLabel('season-options',false,false);fillSelect('#tier',['S+','S','A','B','C','D']);fillSelect('#genre',['EDM','Hip Hop','Pop','R&B','Rock'],v=>genreLabels[v]);fillSelect('#role',['보컬','댄서','센터']);fillSelect('#skill',['피해 증가','피해 감소','경제/골드 수집','이동/차량 속도','조건부 DPS','집결/팬 수용량','팬 수용량']);render()}).catch(()=>{$('#status').className='error';$('#status').textContent='아티스트 데이터를 불러오지 못했습니다. GitHub Pages에서 사이트를 열었는지 확인해 주세요.'});
  </script>
</body>
</html>
