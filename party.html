<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <title>TOPGIRL · 파티 편성 공유</title>
  <link rel="stylesheet" href="./navigation.css">
  <style>
    :root{font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#252824;background:#f5f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{padding-top:30px;padding-bottom:60px}.heading{display:flex;justify-content:space-between;align-items:end;padding:10px 0 22px}.eyebrow{color:#969991;font-size:10px;font-weight:700;letter-spacing:1.6px}h1{font-size:29px;letter-spacing:-1px;margin:8px 0 6px}.sub{margin:0;color:#777c74;font-size:13px}.stamp{color:#8e928a;font-size:11px;margin-top:10px}.genre{padding:8px 11px;border-radius:8px;background:#e8eee9;color:#355c41;font-size:12px;font-weight:700}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}.section-title h2{font-size:15px;margin:0}.section-title span{font-size:10px;color:#8e928a}.members{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.member{overflow:hidden;border:1px solid #e4e3dc;border-top:3px solid var(--rank);border-radius:12px;background:white}.photo{height:clamp(165px,20vw,250px);position:relative;background:#eceee8}.photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}.photo-badges{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between}.badge{padding:5px 7px;border-radius:6px;background:#fffffff0;color:#30352f;font-size:10px;font-weight:800}.slot-label{display:block;margin-bottom:7px;color:#92968f;font-size:9px;font-weight:700}.member-info{padding:11px}.member-name{font-size:14px;font-weight:700}.member-meta{margin-top:5px;color:#7d827a;font-size:10px}.experience-bonus{display:inline-block;margin-top:6px;padding:3px 6px;border-radius:5px;background:#f8f1e8;color:#9b6a3d;font-size:9px;font-weight:700}.party-group{margin-top:12px;padding-bottom:24px;border-bottom:1px solid #e1e3dc}.party-group:last-child{border-bottom:0}.empty-member{min-height:180px;padding:14px;border:1px dashed #d9ddd6;display:flex;flex-direction:column}.empty-member-label{flex:1;display:grid;place-items:center;color:#a0a49c;font-size:12px}.skills{margin-top:22px}.skill-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.skill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #e5e6df;border-radius:9px;background:white}.skill-name{font-size:12px;font-weight:600}.skill-value{flex:none;color:#355c41;font-size:13px;font-weight:800;white-space:nowrap}.sources{display:flex;align-items:center;margin-left:auto;margin-right:8px}.source-photo{position:relative;display:block;flex:none;width:25px;height:32px;margin-left:-4px;overflow:hidden;border:1.5px solid;border-radius:5px;background:#eceee8}.source-photo:first-child{margin-left:0}.source-photo img{width:100%;height:100%;object-fit:cover;object-position:center 25%}.empty,.error{padding:36px 15px;border:1px dashed #dedfd8;border-radius:12px;background:white;color:#777c74;text-align:center}.footer{margin-top:34px;color:#969991;font-size:10px;text-align:center}@media(max-width:1100px){.members{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:680px){.shell{padding-top:20px}.heading{align-items:start;gap:10px}h1{font-size:25px}.members{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:clamp(150px,54vw,225px)}.member-info{padding:9px}.member-name{font-size:13px}.skill-list{grid-template-columns:1fr}.skill{padding:9px}.skill-name{font-size:11px}.skill-value{font-size:12px}}
  </style>
</head>
<body>
  <div class="pages-layout">
    <aside class="pages-sidebar"><a class="pages-brand" href="./"><span class="pages-brand-mark">TG</span><span><b>TOPGIRL</b><small>PUBLIC DIRECTORY</small></span></a><div class="pages-nav-label">PAGES</div><nav class="pages-nav" aria-label="페이지"><a href="./"><span class="pages-nav-icon">▦</span>아티스트</a><a class="active" href="./party.html" aria-current="page"><span class="pages-nav-icon">♟</span>파티 편성</a><a href="./level-plan.html"><span class="pages-nav-icon">✦</span>육성 계산</a></nav><div class="pages-sidebar-note">공개 아티스트 정보와 공유 결과</div></aside>
    <main class="shell">
      <section class="heading"><div><div class="eyebrow">PARTY BUILDER</div><h1>파티 편성 공유</h1><p class="sub">로컬 앱에서 마지막으로 공개 게시한 파티입니다.</p><div class="stamp" id="stamp">편성 정보를 불러오는 중…</div></div></section>
      <section><div class="section-title"><h2>라인업</h2><span>메인 3명 · 서브 2명</span></div><div id="parties"></div></section>
      <footer class="footer">TOPGIRL · GitHub Pages</footer>
    </main>
  </div>
  <script>
    const $=selector=>document.querySelector(selector),number=value=>Number(value||0).toLocaleString('ko-KR');
    const imagePath=value=>'./'+String(value||'').split('/').map(encodeURIComponent).join('/');
    function portrait(file,name,rank){const wrap=document.createElement('span');wrap.className='source-photo';wrap.title=name;wrap.style.borderColor=rank;const img=document.createElement('img');img.src=imagePath(file);img.alt=name;wrap.append(img);return wrap}
    function memberCard(item){const card=document.createElement('article');card.className='member';const slot=document.createElement('span');slot.className='slot-label';slot.textContent=item.slot;card.append(slot);if(!item.artist){card.classList.add('empty-member');const empty=document.createElement('div');empty.className='empty-member-label';empty.textContent='미선택';card.append(empty);return card}const artist=item.artist;card.style.setProperty('--rank',artist.rankColor);const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=imagePath(artist.localImageFile);img.alt=artist.nameKo;const badges=document.createElement('div');badges.className='photo-badges';const tier=document.createElement('span');tier.className='badge';tier.textContent=artist.tier;tier.style.color=artist.tierColor;const rank=document.createElement('span');rank.className='badge';rank.textContent=artist.rank;rank.style.background=artist.rankColor;badges.append(tier,rank);photo.append(img,badges);const info=document.createElement('div');info.className='member-info';const name=document.createElement('div');name.className='member-name';name.textContent=artist.nameKo;const meta=document.createElement('div');meta.className='member-meta';meta.textContent=artist.season?artist.role+' · '+artist.season:artist.role;info.append(name,meta);if(artist.experienceBonusPercent>0){const bonus=document.createElement('div');bonus.className='experience-bonus';bonus.textContent='경험치 +'+artist.experienceBonusPercent+'%';info.append(bonus)}card.append(photo,info);return card}
    function partySection(party){const section=document.createElement('section');section.className='party-group';const heading=document.createElement('div');heading.className='section-title';const title=document.createElement('h2');title.textContent=party.genreLabel+' · '+party.name;const count=document.createElement('span');count.textContent='메인 3명 · 서브 2명';heading.append(title,count);section.append(heading);const members=document.createElement('div');members.className='members';party.members.forEach(item=>members.append(memberCard(item)));section.append(members);const skills=document.createElement('div');skills.className='skills';const skillHeading=document.createElement('div');skillHeading.className='section-title';const skillTitle=document.createElement('h2');skillTitle.textContent='스킬 효과 합계';const skillCount=document.createElement('span');skillCount.textContent=party.skillTotals.length+'종 효과';skillHeading.append(skillTitle,skillCount);skills.append(skillHeading);const list=document.createElement('div');list.className='skill-list';party.skillTotals.forEach(item=>list.append(skillRow(item)));if(!party.skillTotals.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='표시할 수치형 스킬 효과가 없습니다.';list.append(empty)}skills.append(list);section.append(skills);return section}
    function skillRow(item){const row=document.createElement('article');row.className='skill';const name=document.createElement('span');name.className='skill-name';name.textContent=item.label;const sources=document.createElement('span');sources.className='sources';sources.setAttribute('aria-label','출처 아티스트: '+item.sources.map(x=>x.nameKo).join(', '));for(const source of item.sources)sources.append(portrait(source.localImageFile,source.nameKo,source.rankColor));const value=document.createElement('strong');value.className='skill-value';value.textContent=item.unit==='percent'?(item.sign<0?'−':'+')+number(item.value)+'%':item.unit==='damage'?number(item.value)+' 피해':(item.sign<0?'−':'+')+number(item.value)+' DPS';row.append(name,sources,value);return row}
    fetch('./party.json?updated='+Date.now(),{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error();return response.json()}).then(data=>{if(!data.updatedAt||!Array.isArray(data.parties)||!data.parties.length){$('#stamp').textContent='아직 공개된 파티가 없습니다.';$('#parties').className='empty';$('#parties').textContent='로컬 앱의 파티 편성 페이지에서 모든 편성 공개 버튼을 눌러주세요.';return}$('#stamp').textContent='마지막 게시 · '+new Date(data.updatedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})+' · '+data.parties.length+'개 편성';data.parties.forEach(party=>$('#parties').append(partySection(party)))}).catch(()=>{$('#stamp').textContent='편성 정보를 불러오지 못했습니다.';$('#parties').className='error';$('#parties').textContent='공개 파티 데이터를 읽을 수 없습니다.'});
  </script>
</body>
</html>
