  <style>
    :root{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:#272d28;background:#f5f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1440px;margin:auto;padding:30px clamp(18px,3vw,42px) 60px}.eyebrow{color:#829082;font-size:10px;font-weight:800;letter-spacing:.14em}h1{margin:7px 0;font-size:28px}.intro{color:#858b83;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;padding:14px 16px;border:1px solid #e8eae4;border-radius:13px;background:#fff}.toolbar strong{font-size:13px}.toolbar button{padding:9px 13px;border:0;border-radius:8px;background:#355c41;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:10px}.person{display:flex;align-items:center;gap:12px;min-width:0;padding:12px;border:1px solid #e8eae4;border-radius:12px;background:#fff;cursor:pointer}.person input{accent-color:#355c41;width:17px;height:17px;flex:none}.person img{width:48px;height:48px;flex:none;border-radius:50%;object-fit:cover;background:#eceee8}.identity{min-width:0;flex:1}.identity b,.identity small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.identity b{font-size:13px}.identity small{margin-top:4px;color:#858b83;font-size:10px}.badge{padding:4px 6px;border-radius:6px;background:#eef2ec;color:#49614c;font-size:10px;font-weight:800;white-space:nowrap}.empty{padding:30px;text-align:center;color:#858b83}.pages-nav-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:580px){.wrap{padding:21px 14px 45px}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="pages-layout"><aside class="pages-sidebar"><a class="pages-brand" href="./"><span class="pages-brand-mark">TG</span><span><b>TOPGIRL</b><small>PUBLIC DIRECTORY</small></span></a><div class="pages-nav-label">PAGES</div><nav class="pages-nav" aria-label="페이지"><a href="./"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>아티스트</a><a href="./party-result.html"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17M7 15l4-4 3 2 6-7"/><circle cx="20" cy="6" r="1"/></svg></span>파티 편성</a><a href="./favorites.html" class="active" aria-current="page"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>선호 캐릭터</a><a href="./level-plan.html"><span class="pages-nav-icon"><svg viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0zM20 3v4M22 5h-4M4 17v2M5 18H3"/></svg></span>육성 계산</a></nav><div class="pages-sidebar-note">선호 캐릭터는 현재 브라우저에 저장됩니다.</div></aside>
<main class="wrap"><span class="eyebrow">FAVORITE ARTISTS</span><h1>선호 캐릭터 선택</h1><p class="intro">파티 편성 결과에서 더 많은 시즌 활약한 캐릭터부터 표시합니다. 선택은 이 브라우저에 저장되며, 육성 계산에서 선호 캐릭터만 볼 수 있습니다.</p><div class="toolbar"><strong id="count">선호 캐릭터 불러오는 중…</strong><button id="all" type="button">모두 선택</button></div><div id="people" class="grid"></div></main></div>
<script>
  const storageKey="topgirl:favorite-artists:v1", people=document.getElementById("people"), count=document.getElementById("count"), tierOrder={"S+":0,S:1,A:2,B:3,C:4,D:5},rankOrder={UR:0,SSR:1,SR:2,R:3},genreOrder={"Hip Hop":0,"R&B":1,Rock:2,Pop:3,EDM:4},roleOrder={"보컬":0,"댄서":1,"센터":2},displayRank=value=>value.startsWith("UR")?"UR":value;
  let artists=[], favorites=new Set();
  try{favorites=new Set(JSON.parse(localStorage.getItem(storageKey)||"[]").filter(Number.isInteger))}catch{}
  const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify([...favorites]))}catch{};count.textContent=`선호 캐릭터 ${favorites.size}명 선택`};
  async function init(){
    const [artistResponse,resultResponse]=await Promise.all([fetch("./artists.json"),fetch("./party-result.json")]);
    if(!artistResponse.ok||!resultResponse.ok)throw new Error();
    artists=await artistResponse.json();const results=await resultResponse.json(),seasonMap=new Map();
    for(const genre of results.genres||[results])for(const season of genre.seasons||[])for(const artist of season.members||[])if(artist){const entry=seasonMap.get(artist.id)||{indices:new Set(),seasons:[]};entry.indices.add(season.season);entry.seasons.push(season.season);seasonMap.set(artist.id,entry)}
    artists.sort((a,b)=>(seasonMap.get(b.id)?.indices.size||0)-(seasonMap.get(a.id)?.indices.size||0)||(rankOrder[displayRank(a.rank)]??99)-(rankOrder[displayRank(b.rank)]??99)||(genreOrder[a.genre]??99)-(genreOrder[b.genre]??99)||(roleOrder[a.role]??99)-(roleOrder[b.role]??99)||(tierOrder[a.tier]??99)-(tierOrder[b.tier]??99)||a.nameKo.localeCompare(b.nameKo,"ko"));
    people.replaceChildren();for(const artist of artists){const label=document.createElement("label");label.className="person";const input=document.createElement("input");input.type="checkbox";input.checked=favorites.has(artist.id);input.onchange=()=>{if(input.checked)favorites.add(artist.id);else favorites.delete(artist.id);save()};const image=document.createElement("img");image.src="./"+artist.localImageFile;image.alt="";const identity=document.createElement("span");identity.className="identity";const name=document.createElement("b");name.textContent=artist.nameKo;const meta=document.createElement("small");meta.textContent=[artist.tier,artist.rank,artist.role].join(" · ");identity.append(name,meta);const span=seasonMap.get(artist.id);const badge=document.createElement("span");badge.className="badge";badge.textContent=span?.indices.size?`${span.seasons[0]} ~ ${span.seasons.at(-1)} · ${span.indices.size}시즌`:"편성 기록 없음";label.append(input,image,identity,badge);people.append(label)}save();
    }
    document.getElementById("all").onclick=()=>{favorites=favorites.size===artists.length?new Set():new Set(artists.map(artist=>artist.id));people.querySelectorAll("input").forEach((input,index)=>input.checked=favorites.has(artists[index].id));save()};
  }
  init().catch(()=>{count.textContent="캐릭터 데이터를 불러오지 못했습니다.";people.className="empty";people.textContent="시즌 파티 편성 결과가 아직 게시되지 않았을 수 있습니다."});
</script></body></html>
