<main class="wrap"><span class="eyebrow">FAVORITE ARTIST ORDER</span><h1>선호 캐릭터 순위</h1><p class="intro">로컬 앱에서 공개한 선호 순서와 각 캐릭터의 최장 연속 편성 기간입니다.</p><div id="stamp" class="stamp"></div><section id="list" class="list" aria-live="polite"><div class="empty">선호 순위를 불러오는 중…</div></section><footer class="footer">TOPGIRL · GitHub Pages</footer></main>
</div>
<script>
async function loadFavorites(){const list=document.getElementById("list"),stamp=document.getElementById("stamp");try{const response=await fetch("./favorites.json?v="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error();const data=await response.json();list.replaceChildren();if(!data.updatedAt){list.className="empty";list.textContent="아직 공개된 선호 순위가 없습니다. 로컬 앱의 선호 캐릭터 화면에서 공개 게시를 진행해주세요.";return}stamp.textContent="마지막 게시 · "+new Date(data.updatedAt).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"});if(!data.artists?.length){list.className="empty";list.textContent="공개된 선호 캐릭터가 없습니다.";return}list.className="timeline-scroll";const chart=document.createElement("div");chart.className="timeline";const corner=document.createElement("div");corner.className="timeline-head";corner.textContent="선호 순위 / 시즌";chart.append(corner);const seasons=data.seasons||["초기",...Array.from({length:5},(_,i)=>["서울 "+(i+1),"발리 "+(i+1),"로마 "+(i+1)]).flat()];seasons.forEach((season,index)=>{const head=document.createElement("div");head.className="timeline-head";head.textContent=season;head.title=season;chart.append(head)});for(const artist of data.artists.slice().sort((a,b)=>a.priority-b.priority)){const label=document.createElement("div");label.className="timeline-label";const priority=document.createElement("span");priority.className="priority";priority.textContent=String(artist.priority);const image=document.createElement("img");image.className="photo";image.alt="";image.src="./"+artist.localImageFile.split("/").map(encodeURIComponent).join("/");const identity=document.createElement("span");identity.className="timeline-identity";const name=document.createElement("b");name.textContent=artist.nameKo;const meta=document.createElement("small");meta.textContent=[artist.tier,artist.rank,artist.role].join(" · ");identity.append(name,meta);label.append(priority,image,identity);chart.append(label);const active=new Set(artist.activeSeasons||[]);if(!artist.activeSeasons&&artist.seasonCount){const start=seasons.indexOf(artist.startSeason);for(let i=start;i<start+artist.seasonCount;i++)active.add(i)}seasons.forEach((season,index)=>{const cell=document.createElement("span");cell.className="timeline-cell"+(active.has(index)?" active":"")+(active.has(index)&&!active.has(index-1)?" start":"")+(active.has(index)&&!active.has(index+1)?" end":"");cell.title=season+(active.has(index)?" · 편성":" · 미편성");chart.append(cell)})}list.append(chart);const note=document.createElement("div");note.className="timeline-note";note.textContent="색칠된 시즌 칸이 파티 편성 기간입니다. 가로로 밀어 전체 시즌을 확인할 수 있습니다.";list.append(note)}catch{list.className="error";list.textContent="선호 순위를 불러오지 못했습니다."}}loadFavorites();
</script>
