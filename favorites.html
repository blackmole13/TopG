:root{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:#272d28;background:#f5f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:34px clamp(18px,3vw,42px) 60px}.eyebrow{color:#829082;font-size:10px;font-weight:800;letter-spacing:.14em}h1{margin:7px 0;font-size:28px}.intro{color:#858b83;font-size:13px;line-height:1.6}.stamp{margin-top:11px;color:#92978f;font-size:10px}.list{display:grid;gap:9px;margin-top:22px}.favorite-row{display:grid;grid-template-columns:38px 58px minmax(130px,1fr) minmax(180px,.8fr);align-items:center;gap:13px;padding:13px 15px;border:1px solid #e6e9e2;border-radius:13px;background:#fff}.priority{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#e8eee9;color:#355c41;font-weight:800;font-size:13px}.photo{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#f0f1ed}.identity{min-width:0}.identity b,.identity small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.identity b{font-size:14px}.identity small{margin-top:5px;color:#858b83;font-size:10px}.activity{justify-self:end;color:#637262;font-size:12px;font-weight:700;text-align:right}.activity small{display:block;margin-top:4px;color:#92978f;font-size:10px;font-weight:400}.empty,.error{padding:32px;border:1px solid #e6e9e2;border-radius:13px;background:#fff;color:#858b83;text-align:center;font-size:12px}.footer{margin-top:30px;color:#999d96;text-align:center;font-size:10px}.pages-nav-icon svg{display:block;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(max-width:620px){.wrap{padding:24px 14px 45px}.favorite-row{grid-template-columns:32px 45px minmax(0,1fr);gap:9px;padding:10px}.photo{width:42px;height:42px}.activity{grid-column:3;justify-self:start;text-align:left;font-size:11px}.identity{grid-column:3;grid-row:1}.priority{grid-row:1/3}.photo{grid-row:1/3}.activity{grid-row:2}}

<main class="wrap"><span class="eyebrow">FAVORITE ARTIST ORDER</span><h1>선호 캐릭터 순위</h1><p class="intro">로컬 앱에서 공개한 선호 순서와 각 캐릭터의 최장 연속 편성 기간입니다.</p><div id="stamp" class="stamp"></div><section id="list" class="list" aria-live="polite"><div class="empty">선호 순위를 불러오는 중…</div></section><footer class="footer">TOPGIRL · GitHub Pages</footer></main>
</div>
<script>
async function loadFavorites(){const list=document.getElementById("list"),stamp=document.getElementById("stamp");try{const response=await fetch("./favorites.json?v="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error();const data=await response.json();list.replaceChildren();if(!data.updatedAt){list.className="empty";list.textContent="아직 공개된 선호 순위가 없습니다. 로컬 앱의 선호 캐릭터 화면에서 공개 게시를 진행해주세요.";return}stamp.textContent="마지막 게시 · "+new Date(data.updatedAt).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"});if(!data.artists?.length){list.className="empty";list.textContent="공개된 선호 캐릭터가 없습니다.";return}for(const artist of data.artists.slice().sort((a,b)=>a.priority-b.priority)){const row=document.createElement("article");row.className="favorite-row";const priority=document.createElement("span");priority.className="priority";priority.textContent=String(artist.priority);const image=document.createElement("img");image.className="photo";image.alt="";image.src="./"+artist.localImageFile.split("/").map(encodeURIComponent).join("/");const identity=document.createElement("span");identity.className="identity";const name=document.createElement("b");name.textContent=artist.nameKo;const meta=document.createElement("small");meta.textContent=[artist.tier,artist.rank,artist.role].join(" · ");identity.append(name,meta);const activity=document.createElement("span");activity.className="activity";activity.textContent=artist.seasonCount?artist.startSeason+" ~ "+artist.endSeason: "편성 기록 없음";const count=document.createElement("small");count.textContent=artist.seasonCount?artist.seasonCount+"시즌 동안 편성":"시즌 정보 없음";activity.append(count);row.append(priority,image,identity,activity);list.append(row)}}catch{list.className="error";list.textContent="선호 순위를 불러오지 못했습니다."}}loadFavorites();
</script>
